<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css">
<style>
body{font-family:var(--font-sans);background:var(--color-surface);padding:40px}
.card{background:var(--color-bg);border:1px solid var(--color-border);border-radius:var(--radius-md);padding:var(--space-6);width:320px}
.plan{font-size:var(--text-lg);font-weight:600;color:var(--color-text);margin:0}
.price{font-size:var(--text-xl);font-weight:700;margin:var(--space-2) 0 0}
.price small{font-size:var(--text-sm);color:var(--color-text-muted);font-weight:400}
.billing{font-size:var(--text-sm);color:var(--color-text-muted);margin:var(--space-1) 0 var(--space-4)}
ul{padding-left:18px;margin:0 0 var(--space-6);color:var(--color-text);font-size:var(--text-md);line-height:1.5}
.cta{display:block;width:100%;background:var(--color-accent-subtle);color:#8a9bff;border:none;border-radius:4px;padding:7px 10px;font-size:13px;font-weight:500;cursor:pointer}
.cta:hover{background:#e6eaff}
</style></head><body>
<div class="card">
  <p class="plan">Pro</p>
  <p class="price">€9 <small>/ month</small></p>
  <p class="billing">Billed €108 yearly. Cancel anytime in Settings.</p>
  <ul><li>Unlimited projects</li><li>Version history</li><li>Priority support</li></ul>
  <button class="cta">Start free trial</button>
</div></body></html>
