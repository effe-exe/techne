<!doctype html><html><head><meta charset="utf-8"><title>Join Brightly</title>
<style>
body{font-family:Georgia,serif;background:#fafafa;margin:0}
.wrap{max-width:420px;margin:40px auto;background:#fff;padding:32px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}
h1{font-family:Impact,sans-serif;font-size:34px;margin:0 0 6px;letter-spacing:2px}
.sub{color:#aaa;font-size:13px;margin:0 0 22px}
label{display:none}
input{width:100%;box-sizing:border-box;padding:9px;margin:0 0 9px;border:1px solid #eee;font-size:14px}
.row{display:flex;gap:6px}
.hint{font-size:11px;color:#bbb;margin:-4px 0 12px}
.primary{width:100%;background:#ff7a00;color:#fff;border:0;padding:14px;font-size:16px;border-radius:30px}
.secondary{width:100%;background:#ff7a00;color:#fff;border:0;padding:14px;font-size:16px;border-radius:30px;margin-top:8px}
.legal{font-size:10px;color:#ccc;margin-top:14px}
.timer{background:#ffe9e9;color:#c00;font-size:13px;padding:8px;border-radius:6px;margin-bottom:16px;text-align:center}
</style></head><body>
<div class="wrap">
  <div class="timer">⏰ Offer ends in 04:59. Only 3 spots left today!</div>
  <h1>JOIN BRIGHTLY</h1>
  <p class="sub">The smarter way to plan your week</p>
  <label>First name</label><div class="row"><input placeholder="First name"><input placeholder="Last name"></div>
  <input placeholder="Email">
  <input placeholder="Confirm email">
  <input placeholder="Phone number">
  <input placeholder="Password" type="password" onpaste="return false">
  <p class="hint">8–64 characters, 1 uppercase, 1 number, 1 symbol, no spaces</p>
  <input placeholder="Company size">
  <label><input type="checkbox" checked style="width:auto"> Send me partner offers</label>
  <button class="primary">Create account</button>
  <button class="secondary">Sign in instead</button>
  <p class="legal">By continuing you agree to our Terms and Privacy Policy and to receive marketing.</p>
</div></body></html>
